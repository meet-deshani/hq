name: Deploy Z9S-AI HQ Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize deploys. Two merges landing seconds apart used to fire two concurrent
# runs that hit the VPS sshd at the same instant — one won and the other's
# ssh-keyscan/connect timed out and failed the job. This queues runs instead of
# racing them. cancel-in-progress:false means we never abort a deploy mid-flight;
# a superseded *pending* run is cancelled (grey), not failed (red). The VPS always
# resets to origin/main, so a queued run still ships the latest commit.
concurrency:
  group: deploy-hq
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    # Production runs on Postgres; local dev and the offline suites run on
    # SQLite. TabDesk's SQL views and array filters are written PER DIALECT, so
    # the Postgres-only code paths — the guarded ::numeric / ::date casts and the
    # jsonb @> containment — get no coverage at all from a SQLite run. This
    # service exists so those paths are tested against the engine that actually
    # serves them before anything reaches production.
    services:
      postgres:
        # Must track the production server's MAJOR version — hq.dotsai.in runs
        # Postgres 17. Testing dialect-specific SQL against a different major
        # than production is most of the way to not testing it at all.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hq_ci
          POSTGRES_PASSWORD: hq_ci_password
          POSTGRES_DB: hq_ci_tabdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The suite runs against a throwaway SQLite file, never the production
      # Postgres in the repo .env — the same guard scripts/dev.sh applies locally.
      - name: Offline suites
        env:
          DATABASE_URL: sqlite:////tmp/hq-ci.db
          SECRET_KEY: ci-only-not-a-production-secret
        run: |
          for suite in tests/permissions_seed_test.py \
                       tests/zoho_client_test.py \
                       tests/zoho_sync_test.py \
                       tests/whatsapp_send_test.py \
                       tests/comms_ingest_test.py \
                       tests/tabdesk_test.py; do
            echo "── $suite"
            python "$suite"
          done

      # TabDesk on the engine production actually uses. Not optional: a bug in
      # the guarded casts is invisible on SQLite and total on Postgres — one bad
      # cell would break a whole view for every reader.
      - name: TabDesk on Postgres
        env:
          TABDESK_PG_DSN: postgresql://hq_ci:hq_ci_password@127.0.0.1:5432/hq_ci_tabdesk
          SECRET_KEY: ci-only-not-a-production-secret
        run: python tests/tabdesk_postgres_test.py

      # The contract test needs a live server, so CI starts one. No WhatsApp and
      # no Zoho credentials are set here, which is deliberate: an unconfigured
      # server must still pass, and nothing in a CI run can reach a real person.
      - name: API contract
        env:
          DATABASE_URL: sqlite:////tmp/hq-ci-api.db
          SECRET_KEY: ci-only-not-a-production-secret
          SEED_ADMIN_PASSWORD: ci-admin-password
          SEED_NISHANT_PASSWORD: ci-nishant-password
          SEED_HEMISH_PASSWORD: ci-hemish-password
          COMMS_WEBHOOK_TOKEN: ci-webhook-secret
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8077 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8077/login && break
            sleep 1
          done
          python tests/api_smoke.py --base http://127.0.0.1:8077

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    # Nothing reaches production that the suite has not passed.
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # ssh-keyscan defaults to a 5s timeout and, under `set -e`, a single
          # transient miss (non-zero exit) killed the whole deploy job — the
          # cause of the intermittent red runs. Retry, and never let a keyscan
          # hiccup fail the deploy: host verification falls back to accept-new
          # on the ssh call below if known_hosts ends up empty.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H 72.62.229.16 >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan succeeded (attempt $i)"
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying in 5s..."
            sleep 5
          done

      - name: Trigger VPS Deploy Script
        run: |
          # Force-align the VPS checkout to origin/main BEFORE deploying so a
          # stale/locally-modified tracked file (e.g. docker-compose.yml written
          # by deploy.sh at init) can never abort deploy.sh's `git pull --ff-only`.
          # reset --hard only touches tracked files; untracked .env/.deploy.env
          # are preserved. This makes deploys self-healing against config drift.
          #
          # Retried, because reaching the box is a separate problem from deploying
          # on it. The VPS runs fail2ban with a DROP action, so a runner IP that
          # tripped it — or any blip between GitHub and Hostinger — surfaces as
          # `connect ... Connection timed out` and used to fail the whole deploy
          # on the first try. ssh-keyscan above was already hardened this way; the
          # step that actually matters was not.
          #
          # ONLY connection failures are retried. ssh exits 255 for its own
          # errors and otherwise passes the remote command's status through, so a
          # deploy that genuinely breaks on the VPS fails immediately rather than
          # being run three more times.
          deploy_cmd='git -C /opt/apps/hq fetch origin main && git -C /opt/apps/hq reset --hard origin/main && deploy hq'
          for attempt in 1 2 3; do
            set +e
            ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              root@72.62.229.16 "$deploy_cmd"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ "$status" -ne 255 ]; then
              echo "Deploy ran on the VPS and failed with status $status — not retrying."
              exit "$status"
            fi
            echo "Could not reach the VPS (attempt $attempt/3)."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "The VPS was unreachable on every attempt. This is connectivity, not the build."
          exit 255
